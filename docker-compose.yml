# Airflow 3 local, em modo standalone, só para a coleta do SeguWatts.
# A interface fica em http://localhost:8080 e a senha gerada é exibida nos logs.
services:
  airflow:
    image: apache/airflow:3.1.3-python3.12
    command: standalone
    restart: unless-stopped
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__CORE__PARALLELISM: "8"
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "8"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: "America/Sao_Paulo"
      AIRFLOW_VAR_SEGUWATTS_CHEGADA: /opt/airflow/chegada
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./chegada:/opt/airflow/chegada
