<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SeguWatts: sua energia em dia</title>
<style>
  :root {
    color-scheme: light;
    --fundo: #fcfcfb; --cartao: #ffffff; --borda: #e4e3de;
    --texto: #0b0b0b; --texto-2: #52514e;
    --azul: #2a78d6; --azul-escuro: #184f95;
    --critico: #d03b3b; --atencao: #fab219; --bom: #0ca30c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fundo); color: var(--texto); font: 17px/1.5 system-ui, "Segoe UI", Roboto, sans-serif; }
  main, header { max-width: 900px; margin: 0 auto; padding: 0 20px; }
  header { padding-top: 28px; }
  h1 { font-size: 30px; margin: 0; letter-spacing: -0.5px; }
  h2 { font-size: 21px; margin: 0 0 4px; }
  .sub { color: var(--texto-2); margin: 0; }
  label { display: block; font-weight: 600; margin: 20px 0 6px; }
  select { font: inherit; padding: 10px 12px; border: 1px solid #8a8983; border-radius: 8px; background: #fff; width: 100%; max-width: 440px; }
  :focus-visible { outline: 3px solid var(--azul-escuro); outline-offset: 2px; }
  section { background: var(--cartao); border: 1px solid var(--borda); border-radius: 12px; padding: 20px; margin: 16px 0; }
  .numeros { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin: 16px 0; }
  .numero { background: var(--cartao); border: 1px solid var(--borda); border-radius: 12px; padding: 16px 20px; }
  .numero b { display: block; font-size: 30px; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .numero span { color: var(--texto-2); font-size: 15px; }
  .alerta { display: flex; gap: 12px; padding: 14px 0; border-top: 1px solid var(--borda); }
  .alerta:first-of-type { border-top: 0; }
  .selo { flex: none; align-self: flex-start; font-size: 14px; font-weight: 700; padding: 3px 10px; border-radius: 999px; color: #0b0b0b; white-space: nowrap; }
  .selo.critico { background: var(--critico); color: #fff; }
  .selo.atencao { background: var(--atencao); }
  .tudo-bem { display: flex; gap: 10px; align-items: center; margin-top: 8px; }
  .tudo-bem i { font-style: normal; font-weight: 700; color: #fff; background: var(--bom); border-radius: 50%; width: 24px; height: 24px; display: inline-grid; place-items: center; flex: none; }
  .mapa { display: grid; grid-template-columns: 74px repeat(24, 1fr); gap: 2px; margin-top: 14px; font-size: 13px; color: var(--texto-2); }
  .mapa div.c { height: 24px; border-radius: 3px; }
  .mapa .hora { text-align: center; }
  .legenda { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--texto-2); margin-top: 10px; }
  .legenda i { display: block; width: 140px; height: 10px; border-radius: 3px; background: linear-gradient(90deg, #cde2fb, #2a78d6, #0d366b); }
  .barras { display: flex; align-items: flex-end; gap: 10px; height: 180px; margin-top: 18px; border-bottom: 1px solid #8a8983; }
  .barra { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; text-align: center; font-size: 14px; color: var(--texto); }
  .barra div { background: var(--azul); border-radius: 4px 4px 0 0; min-height: 2px; }
  .meses { display: flex; gap: 10px; font-size: 14px; color: var(--texto-2); margin-top: 6px; }
  .meses span { flex: 1; text-align: center; }
  .aparelho { display: grid; grid-template-columns: 165px 1fr 150px; gap: 10px; align-items: center; padding: 6px 0; font-size: 15px; }
  .aparelho .trilho { background: #f0efec; border-radius: 4px; height: 12px; }
  .aparelho .trilho div { background: var(--azul); height: 12px; border-radius: 4px; }
  .aparelho small { color: var(--texto-2); font-size: 14px; text-align: right; }
  details { margin-top: 12px; font-size: 15px; }
  summary { cursor: pointer; font-weight: 600; }
  .rolagem { overflow-x: auto; }
  table { border-collapse: collapse; font-size: 13px; margin-top: 8px; font-variant-numeric: tabular-nums; }
  th, td { padding: 3px 6px; border-bottom: 1px solid var(--borda); text-align: right; }
  th:first-child { text-align: left; }
  #dica { position: fixed; pointer-events: none; background: #0b0b0b; color: #fff; padding: 5px 9px; border-radius: 6px; font-size: 14px; display: none; z-index: 5; }
  #aviso { background: #fff5dd; border: 1px solid var(--atencao); border-radius: 8px; padding: 10px 14px; margin-top: 12px; display: none; }
  footer { max-width: 900px; margin: 8px auto 36px; padding: 0 20px; color: var(--texto-2); font-size: 14px; }
  @media (max-width: 620px) {
    .mapa { grid-template-columns: 56px repeat(24, 1fr); gap: 1px; }
    .mapa .hora { font-size: 10px; }
    .aparelho { grid-template-columns: 1fr 120px; }
    .aparelho .trilho { grid-column: 1 / -1; grid-row: 2; }
  }
</style>
</head>
<body>
<header>
  <h1>SeguWatts</h1>
  <p class="sub">Segura os watts: entenda sua energia e pague menos.</p>
  <label for="casa">Escolha uma casa de demonstração</label>
  <select id="casa" disabled><option>Carregando…</option></select>
  <div id="aviso" role="status"></div>
</header>
<main id="conteudo" aria-live="polite"></main>
<footer>
  Dados de casas fictícias, com clima e tarifas reais. Valores sem ICMS, PIS e COFINS.
  Um aviso sugere uma verificação e não confirma defeito.
  Nenhum nome, CPF ou e-mail é usado nesta tela.
</footer>
<div id="dica" role="presentation"></div>

<script>
const CHAVE = "seguwatts_ultimo_dado";
const DIAS = ["Domingo", "Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado"];
const MESES = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
const brl = v => v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const num = (v, c = 1) => v.toLocaleString("pt-BR", { minimumFractionDigits: c, maximumFractionDigits: c });
const conteudo = document.getElementById("conteudo");
const dica = document.getElementById("dica");

function el(tag, atributos = {}, ...filhos) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(atributos)) {
    if (k === "class") n.className = v;
    else if (k === "style") n.style.cssText = v;
    else if (k === "dica") { n.dataset.dica = v; }
    else n.setAttribute(k, v);
  }
  filhos.flat().forEach(f => n.append(f));
  return n;
}

function corDoMapa(t) {
  // Rampa sequencial de um único tom, do claro ao escuro.
  const pontos = [[205, 226, 251], [42, 120, 214], [13, 54, 107]];
  const i = t < 0.5 ? 0 : 1, f = t < 0.5 ? t * 2 : (t - 0.5) * 2;
  return `rgb(${pontos[i].map((c, j) => Math.round(c + (pontos[i + 1][j] - c) * f)).join(",")})`;
}

const nomeMes = anoMes => MESES[Number(anoMes.slice(5, 7)) - 1];

function secaoAlertas(casa) {
  const ativos = casa.alertas.filter(a => a.status === "critico" || a.status === "atencao")
    .sort((a, b) => b.excesso_pct - a.excesso_pct);
  const s = el("section", {}, el("h2", {}, "Algum aparelho precisa de atenção?"));
  if (!ativos.length) {
    s.append(el("p", { class: "tudo-bem" }, el("i", { "aria-hidden": "true" }, "✓"), "Tudo dentro do normal nos aparelhos monitorados."));
    return s;
  }
  ativos.forEach(a => {
    const rotulo = a.status === "critico" ? "⚠ Urgente" : "! Atenção";
    const desde = new Date(a.desde + "T12:00:00").toLocaleDateString("pt-BR");
    s.append(el("div", { class: "alerta" },
      el("span", { class: `selo ${a.status}` }, rotulo),
      el("div", {}, el("strong", {}, a.mensagem),
        el("div", { class: "sub" }, `Desde ${desde}. Resolver pode poupar cerca de ${brl(a.rs_excesso_mes)} por mês (${num(a.kwh_excesso_mes)} kWh).`))));
  });
  return s;
}

function secaoMapa(casa) {
  const valor = {};
  casa.perfil_semana.forEach(p => valor[`${p.dia_semana_num}-${p.hora}`] = p.kwh_medio);
  const lista = casa.perfil_semana.map(p => p.kwh_medio);
  const max = Math.max(...lista), min = Math.min(...lista);
  const pico = casa.perfil_semana.reduce((a, b) => (b.kwh_medio > a.kwh_medio ? b : a));
  const mapa = el("div", { class: "mapa", role: "img",
    "aria-label": `Mapa de consumo por dia e hora. O maior consumo é ${pico.dia_semana} às ${pico.hora} horas, com ${num(pico.kwh_medio, 2)} kWh.` });
  mapa.append(el("span"));
  for (let h = 0; h < 24; h++) mapa.append(el("span", { class: "hora" }, h % 3 === 0 ? `${h}h` : ""));
  for (let d = 1; d <= 7; d++) {
    mapa.append(el("span", {}, DIAS[d - 1]));
    for (let h = 0; h < 24; h++) {
      const v = valor[`${d}-${h}`] ?? 0;
      mapa.append(el("div", { class: "c", style: `background:${corDoMapa((v - min) / (max - min || 1))}`,
        dica: `${DIAS[d - 1]}, ${h}h: ${num(v, 2)} kWh` }));
    }
  }
  const cabeca = el("tr", {}, el("th", { scope: "col" }, "Dia"), [...Array(24).keys()].map(h => el("th", { scope: "col" }, `${h}h`)));
  const linhas = DIAS.map((nome, i) => el("tr", {}, el("th", { scope: "row" }, nome),
    [...Array(24).keys()].map(h => el("td", {}, num(valor[`${i + 1}-${h}`] ?? 0, 2)))));
  return el("section", {},
    el("h2", {}, `Seu pico é ${pico.dia_semana.toLowerCase()} às ${pico.hora}h`),
    el("p", { class: "sub" }, "Consumo médio de cada hora da semana. Quanto mais escuro, mais energia."),
    mapa,
    el("div", { class: "legenda" }, "menos", el("i"), "mais"),
    el("details", {}, el("summary", {}, "Ver como tabela (kWh)"),
      el("div", { class: "rolagem" }, el("table", {}, el("thead", {}, cabeca), el("tbody", {}, linhas)))));
}

function secaoMeses(casa) {
  const dados = casa.painel.map(p => ({ ...p, custo30: p.custo_rs / p.dias_medidos * 30 }));
  const max = Math.max(...dados.map(d => d.custo30));
  const barras = el("div", { class: "barras", role: "img",
    "aria-label": dados.map(d => `${nomeMes(d.ano_mes)}: ${brl(d.custo30)}`).join("; ") });
  const meses = el("div", { class: "meses", "aria-hidden": "true" });
  dados.forEach((d, i) => {
    const mostrar = i === dados.length - 1 || d.custo30 === max;
    barras.append(el("div", { class: "barra", dica: `${nomeMes(d.ano_mes)}: ${brl(d.custo30)}, ${num(d.temperatura_media)} °C, bandeira ${d.bandeira}` },
      mostrar ? brl(d.custo30) : "",
      el("div", { style: `height:${(d.custo30 / max * 86).toFixed(1)}%` })));
    meses.append(el("span", {}, nomeMes(d.ano_mes)));
  });
  return el("section", {},
    el("h2", {}, "Quanto custa por mês"),
    el("p", { class: "sub" }, "Custo equivalente a 30 dias, para comparar meses incompletos."),
    barras, meses);
}

function secaoAparelhos(casa) {
  const max = Math.max(...casa.aparelhos.map(a => a.kwh));
  const fim = casa.aparelhos[0] ? new Date(casa.aparelhos[0].fim_ciclo + "T12:00:00").toLocaleDateString("pt-BR") : "";
  return el("section", {},
    el("h2", {}, "O que mais pesa na conta"),
    el("p", { class: "sub" }, casa.aparelhos.length ? `Última conta fechada em ${fim}.` : "Ainda não há conta fechada."),
    casa.aparelhos.slice(0, 8).map(a => el("div", { class: "aparelho" },
      el("span", {}, a.rotulo),
      el("div", { class: "trilho", "aria-hidden": "true" }, el("div", { style: `width:${(a.kwh / max * 100).toFixed(1)}%` })),
      el("small", {}, `${brl(a.custo_rs)} · ${a.origem_medicao === "medido" ? "medido" : "estimado"}`))));
}

function desenhar(casa) {
  const ultimo = casa.painel[casa.painel.length - 1];
  const custo30 = ultimo.custo_rs / ultimo.dias_medidos * 30;
  const ativos = casa.alertas.filter(a => a.status === "critico" || a.status === "atencao");
  const economia = ativos.reduce((t, a) => t + a.rs_excesso_mes, 0);
  conteudo.replaceChildren(
    el("div", { class: "numeros" },
      el("div", { class: "numero" }, el("b", {}, brl(custo30)), el("span", {}, `ritmo de gasto em ${nomeMes(ultimo.ano_mes)}, em 30 dias`)),
      el("div", { class: "numero" }, el("b", {}, `${num(ultimo.kwh_total / ultimo.dias_medidos)} kWh`), el("span", {}, "por dia, em média")),
      el("div", { class: "numero" }, el("b", {}, brl(economia)), el("span", {}, "de economia possível por mês"))),
    secaoAlertas(casa), secaoMapa(casa), secaoMeses(casa), secaoAparelhos(casa));
}

function iniciar(dados) {
  const peso = c => c.alertas.filter(a => a.status === "critico").length * 2 + c.alertas.filter(a => a.status === "atencao").length;
  const casas = dados.residencias.filter(c => c.painel.length).sort((a, b) => peso(b) - peso(a));
  const seletor = document.getElementById("casa");
  seletor.replaceChildren(...casas.map((c, i) => {
    const alertas = peso(c) ? " (com aviso)" : "";
    return el("option", { value: i }, `${c.rotulo}, ${c.municipio}${alertas}`);
  }));
  seletor.disabled = false;
  seletor.onchange = () => desenhar(casas[seletor.value]);
  desenhar(casas[0]);
}

document.addEventListener("mousemove", e => {
  const alvo = e.target.closest ? e.target.closest("[data-dica]") : null;
  if (!alvo) { dica.style.display = "none"; return; }
  dica.textContent = alvo.dataset.dica;
  dica.style.display = "block";
  dica.style.left = Math.min(e.clientX + 12, innerWidth - dica.offsetWidth - 8) + "px";
  dica.style.top = (e.clientY - 34) + "px";
});

(async () => {
  try {
    const resposta = await fetch("dados/seguwatts_mvp.json", { cache: "no-cache" });
    if (!resposta.ok) throw new Error(resposta.status);
    const dados = await resposta.json();
    try { localStorage.setItem(CHAVE, JSON.stringify(dados)); } catch { /* sem espaço: segue sem cópia */ }
    iniciar(dados);
  } catch {
    const copia = localStorage.getItem(CHAVE);
    const aviso = document.getElementById("aviso");
    aviso.style.display = "block";
    if (copia) {
      aviso.textContent = "Sem conexão: mostrando os últimos dados salvos neste aparelho.";
      iniciar(JSON.parse(copia));
    } else {
      aviso.textContent = "Não foi possível carregar os dados. Verifique a conexão e tente de novo.";
      document.getElementById("casa").replaceChildren(el("option", {}, "Sem dados"));
    }
  }
})();
</script>
</body>
</html>
